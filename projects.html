<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Santero Город — SANTERO</title>
</head>
<body>
<script>
(async function(){
  const url = 'https://raw.githubusercontent.com/nuroxsfera/santero-website/88522ce1770f8e8bafe96aa391743b0f565920bd/projects.html';
  const html = await (await fetch(url)).text();
  document.open();
  document.write(html);
  document.close();
  // Fix menu after inject
  setTimeout(function(){
    document.querySelectorAll('a').forEach(function(a){
      if (a.textContent.trim() === 'О нас' || (a.getAttribute('href')||'').indexOf('#about') !== -1) {
        a.setAttribute('href', 'research.html');
        a.textContent = 'Исследования';
      }
    });
  }, 50);
})();
</script>
</body>
</html>
